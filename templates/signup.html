{% extends 'base.html' %}

{% block title %}Sign Up | HealthPulse{% endblock %}

{% block page_title %}Create your account{% endblock %}

{% block content %}
<div class="auth-grid">
  <div class="auth-panel glass-card">
    <h2>Join HealthPulse</h2>
    <p>Sign up to start scheduling your medicines and wellness reminders.</p>
    <form action="{{ url_for('signup') }}" method="post" class="auth-form">
      <label>Full Name</label>
      <input type="text" name="name" placeholder="Alex Green" required />
      <label>Email</label>
      <input type="email" name="email" placeholder="you@example.com" required />
      <label>Password</label>
      <input type="password" name="password" placeholder="Create a password" required />
      <label>Confirm Password</label>
      <input type="password" name="confirm_password" placeholder="Repeat password" required />
      <button type="submit" class="btn btn-primary">Sign Up</button>
      <p class="auth-note">Already have an account? <a href="{{ url_for('login') }}">Login</a></p>
    </form>
  </div>
</div>
{% endblock %}
